<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5526">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Tamales Santi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Concepto: app de celular de una sola columna (máx. 480 px), barra verde de la marca arriba, tarjetas blancas y menú de módulos EF01–EF09 */
:root {
  --bg: #F7F3E8; --surface: #FFFFFF; --ink: #1F2A1F; --muted: #5B6A58; --line: #DDE3D6;
  --green: #17652E; --green-ink: #17652E; --bar: #0E5526; --leaf: #7BC043; --orange: #F5A21B; --tint: #E9F4E4; --cream: #FDF1DC;
  --ok-bg: #E6F4E3; --ok-fg: #1B6A2F; --warn-bg: #FFF1D2; --warn-fg: #8A5300; --none-bg: #EEF0EC; --none-fg: #555F53;
  --err-bg: #FDECEC; --err-fg: #B3261E; --err-line: #EFA9A9; --scrim: rgba(15, 30, 18, .45);
  --shadow: 0 3px 14px rgba(23, 101, 46, .10);
  --font-body: "Roboto", "Segoe UI", Arial, sans-serif; --font-brand: "Nunito", "Roboto", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1712; --surface: #172219; --ink: #E7EFE5; --muted: #A5B4A2; --line: #2B3A2E;
    --green: #2E8B45; --green-ink: #7FCB86; --bar: #0B3A1B; --leaf: #8CCB55; --orange: #F5A21B; --tint: #1D3222; --cream: #33291A;
    --ok-bg: #1C3522; --ok-fg: #8FD596; --warn-bg: #3A2D10; --warn-fg: #F3C56A; --none-bg: #262E27; --none-fg: #B9C3B6;
    --err-bg: #3A1B1A; --err-fg: #F2A19B; --err-line: #6E3330; --scrim: rgba(0, 0, 0, .6); --shadow: 0 3px 14px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1712; --surface: #172219; --ink: #E7EFE5; --muted: #A5B4A2; --line: #2B3A2E;
  --green: #2E8B45; --green-ink: #7FCB86; --bar: #0B3A1B; --leaf: #8CCB55; --orange: #F5A21B; --tint: #1D3222; --cream: #33291A;
  --ok-bg: #1C3522; --ok-fg: #8FD596; --warn-bg: #3A2D10; --warn-fg: #F3C56A; --none-bg: #262E27; --none-fg: #B9C3B6;
  --err-bg: #3A1B1A; --err-fg: #F2A19B; --err-line: #6E3330; --scrim: rgba(0, 0, 0, .6); --shadow: 0 3px 14px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
@media (min-width: 560px) { .app { box-shadow: 0 0 0 1px var(--line); } }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* barra superior */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: #fff; padding-block: 8px 12px; display: flex; align-items: center; gap: 8px; min-height: 60px; }
.barra::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--leaf), #F7B529 45%, var(--orange)); }
.barra .logo { height: 38px; width: auto; display: block; }
.barra .tit { flex: 1; min-width: 0; font-family: var(--font-brand); font-weight: 900; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { background: transparent; border: 0; color: #fff; width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 42px; }
.ib:hover { background: rgba(255, 255, 255, .12); }
.ib svg { width: 22px; height: 22px; }
.rol { font-size: 12px; font-weight: 700; background: #F7B529; color: #2B2B2B; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

main { flex: 1; padding-block: 16px 28px; display: flex; flex-direction: column; gap: 14px; }
h1.t { font-family: var(--font-brand); font-weight: 900; font-size: 24px; line-height: 1.15; margin: 0; color: var(--green-ink); text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.ej { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 0 4px; vertical-align: 2px; }

.tarjeta { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tarjeta h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
.tarjeta h2 svg { width: 18px; height: 18px; color: var(--green-ink); flex: 0 0 18px; }
.nota { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--muted); background: var(--tint); border-radius: 12px; padding: 10px 12px; }
.nota svg { flex: 0 0 18px; width: 18px; height: 18px; color: var(--green-ink); margin-top: 1px; }

/* campos */
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo label { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.campo label svg { width: 17px; height: 17px; color: var(--green-ink); }
.req { color: var(--err-fg); }
.campo input, .campo select { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px; width: 100%; }
.campo input[readonly] { color: var(--muted); }
.campo.error input, .campo.error select { border: 2px solid var(--err-fg); background: var(--err-bg); }
.msg { font-size: 12.5px; color: var(--err-fg); }
.msg:empty { display: none; }
.ayuda { font-size: 12px; color: var(--muted); margin: 0; }
.fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 360px) { .fila2 { grid-template-columns: 1fr; } }
.grupo { display: flex; }
.grupo input { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.grupo .btn { border-top-left-radius: 0; border-bottom-left-radius: 0; min-height: 46px; padding-inline: 12px; }

/* botones */
.acciones { display: flex; flex-wrap: wrap; gap: 10px; }
.acciones .btn-pri { flex: 1 1 160px; }
.btn { font: inherit; font-weight: 700; border-radius: 12px; padding: 10px 14px; border: 1.5px solid var(--green); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; text-decoration: none; }
.btn svg { width: 18px; height: 18px; }
.btn-pri { background: var(--green); color: #fff; box-shadow: 0 3px 8px rgba(23, 101, 46, .25); }
.btn-sec { background: var(--surface); color: var(--green-ink); }
.btn-peq { min-height: 36px; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn-txt { border-color: transparent; background: transparent; color: var(--green-ink); }
.btn-peligro { border-color: var(--err-fg); background: var(--err-fg); color: #fff; }
.btn:focus-visible, input:focus-visible, select:focus-visible, .ib:focus-visible, .mod:focus-visible { outline: 3px solid #F7B529; outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* alertas */
.alerta { border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.alerta svg { flex: 0 0 20px; width: 20px; height: 20px; margin-top: 1px; }
.a-ok { background: var(--ok-bg); color: var(--ok-fg); }
.a-err { background: var(--err-bg); color: var(--err-fg); border: 1px solid var(--err-line); }
.a-warn { background: var(--warn-bg); color: var(--warn-fg); }
.alerta a { color: inherit; font-weight: 700; }

/* chips */
.chip { display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 8px; font-weight: 500; white-space: nowrap; }
.c-ok { background: var(--ok-bg); color: var(--ok-fg); }
.c-warn { background: var(--warn-bg); color: var(--warn-fg); }
.c-none { background: var(--none-bg); color: var(--none-fg); }
.c-err { background: var(--err-bg); color: var(--err-fg); }

/* login */
.login { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding-block: 24px; }
.login .marca { background: var(--bar); border-radius: 20px; padding: 18px; display: flex; justify-content: center; position: relative; overflow: hidden; }
.login .marca img { height: 64px; }
.login .marca::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, var(--leaf), #F7B529 45%, var(--orange)); }
.lema { display: flex; align-items: center; gap: 10px; justify-content: center; font-family: var(--font-brand); font-style: italic; font-weight: 800; color: var(--green-ink); font-size: 15px; margin: 0; }
.lema::before, .lema::after { content: ""; height: 2px; width: 40px; background: var(--leaf); opacity: .7; }
details.demo { font-size: 13px; color: var(--muted); }
details.demo summary { cursor: pointer; font-weight: 700; color: var(--green-ink); }
details.demo table { margin-top: 6px; }

/* menú */
.saludo { display: flex; flex-direction: column; gap: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .n { font-family: var(--font-brand); font-weight: 900; font-size: 28px; line-height: 1; color: var(--green-ink); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
.mods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mod { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); border: 0; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.mod .ico { width: 42px; height: 42px; border-radius: 50%; background: var(--tint); color: var(--green-ink); display: flex; align-items: center; justify-content: center; }
.mod .ico svg { width: 22px; height: 22px; }
.mod b { font-size: 15px; }
.mod span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.mod .ef { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }
.mod.web .ico { background: var(--cream); color: var(--warn-fg); }

/* listas */
.lista { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; min-width: 0; }
.item .nombre { font-weight: 700; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.item .lado { grid-row: span 2; text-align: right; }
.item .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.item .acc { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.big { font-family: var(--font-brand); font-weight: 900; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--muted); }
.bajo .big { color: var(--warn-fg); } .cero .big { color: var(--none-fg); }
.vacio { background: var(--surface); border-radius: 14px; padding: 18px 16px; text-align: center; color: var(--muted); box-shadow: var(--shadow); font-size: 14px; }
.resumen { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.resumen .big { font-size: 44px; color: var(--green-ink); grid-row: span 2; }
.resumen .chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* tabla */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
.nuevo td { background: var(--tint); }
.cant-in { width: 72px; font: inherit; font-size: 16px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); text-align: right; }

/* cliente elegido */
.elegido { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--tint); border-radius: 12px; padding: 10px 12px; }
.elegido b { display: block; }
.elegido span { font-size: 12.5px; color: var(--muted); }

/* hoja (diálogo) */
.velo { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.hoja { background: var(--surface); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 85%; overflow-y: auto; }
.hoja h3 { margin: 0; font-size: 18px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; z-index: 40; max-width: calc(100% - 32px); }

/* página web pública (EF09) */
.web-hero { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.web-hero h1 { font-family: var(--font-brand); font-weight: 900; font-size: 30px; margin: 0; color: var(--green-ink); }
.secciones { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.secciones a { flex: 0 0 auto; font-size: 13px; font-weight: 700; color: var(--green-ink); background: var(--tint); border-radius: 999px; padding: 6px 12px; text-decoration: none; }
.prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prod { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.prod b { font-size: 15px; }
.prod span { font-size: 12.5px; color: var(--muted); }
.prod .precio { font-family: var(--font-brand); font-weight: 900; color: var(--green-ink); font-size: 20px; }
.pie { text-align: center; font-size: 11px; color: var(--muted); margin: 0; }
.dato { display: flex; gap: 10px; align-items: flex-start; }
.dato svg { width: 20px; height: 20px; color: var(--green-ink); flex: 0 0 20px; margin-top: 2px; }
.pendiente { color: var(--muted); font-style: italic; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="app">
  <header class="barra gut" id="barra" hidden></header>
  <main class="gut" id="vista" aria-live="polite"></main>
</div>
<div id="capa"></div>
<div class="toast" id="toast" role="status" hidden></div>

  function isoHoy() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function isoAFecha(iso) { var f = iso.split("-"); return f[2] + "/" + f[1] + "/" + f[0]; }
  function fechaAIso(f) { var p = f.split("/"); return p[2] + "-" + p[1] + "-" + p[0]; }
  function ahora() { var d = new Date(), h = d.getHours(), ap = h < 12 ? "a. m." : "p. m."; h = h % 12 || 12; return fechaHoy() + " " + h + ":" + pad(d.getMinutes()) + " " + ap; }

  function registrarInsumos() {
    var items = [], malo = false;

    });

    if (malo || !f) { mostrarErrorForm("Revise los campos marcados."); return; }
    if (!items.length) { mostrarErrorForm("Escriba la cantidad de al menos un insumo."); return; }

    items.forEach(function (x) { var i = insumo(x.id); i.stock[x.u] = (i.stock[x.u] || 0) + x.q; });
    db.seq.compra = (db.seq.compra || 0) + 1;

      case "pago-si": confirmarPago(id); break;
      case "pago-no": cerrarHoja(); ui.pedListMsg = alerta("warn", "<b>El pago no ha sido confirmado.</b> No se registró la venta del pedido " + num(id, 4) + "."); mostrar(); break;
      case "emp-estado": var u = db.usuarios.filter(function (x) { return x.id === id; })[0]; u.estado = !u.estado; guardar(); ui.empMsg = alerta("ok", "<b>" + esc(u.nombres + " " + u.apellidos) + "</b> quedó " + (u.estado ? "activo" : "inactivo") + "."); mostrar(); break;
      case "pre-registrar": registrarPrecio(id); break;
      case "pre-venta": var t = tipo(id); t.venta = el.checked; guardar(); aviso(t.nombre + (t.venta ? " disponible para la venta" : " no disponible para la venta")); break;
      case "ins-llenar": ui.insPre = {}; db.insumos.forEach(function (i) { if (i.req != null) ui.insPre[i.id] = { q: String(i.req), u: i.uni }; }); mostrar(); aviso("Cantidades del proceso para 100 tamales"); break;
      case "ins-qr": hoja('<h3>Código QR · Registrar insumos</h3><img src="' + QR + '" alt="Código QR para registrar insumos" style="width:240px;max-width:100%;align-self:center;image-rendering:pixelated"><p style="margin:0">Al escanearlo con la cámara del celular se abre esta pantalla. Primero se pide iniciar sesión.</p><div class="acciones"><button class="btn btn-sec" data-a="cerrar-hoja">Cerrar</button></div>'); break;
      case "ancla": ev.preventDefault(); var s = $(el.getAttribute("data-id")); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    }
    if (el.closest(".hoja") && a === "cli-pedido") cerrarHoja();
  });
  document.addEventListener("input", function (ev) {
    if (ev.target.classList.contains("cant-in")) { guardarBorradorPedido(); recalcularPedido(); }
    if (ev.target.id === "tt") actualizarPrecioVenta();
  });
  document.addEventListener("change", function (ev) {
    if (ev.target.id === "tt") actualizarPrecioVenta();
    if (ev.target.id === "pcli" && ev.target.value) { guardarBorradorPedido(); ui.pedCli = parseInt(ev.target.value, 10); mostrar(); }
    if (ev.target.id === "fent") ui.pedFecha = ev.target.value;
  });
  function guardarBorradorPedido() { ui.pedCant = ui.pedCant || {}; db.tipos.forEach(function (t) { var e = $("q" + t.id); if (e) ui.pedCant[t.id] = e.value; }); var f = $("fent"); if (f) ui.pedFecha = f.value; }
  function actualizarPrecioVenta() { var t = tipo(parseInt(val("tt"), 10)); if ($("pv")) $("pv").value = t ? (t.precio == null ? "Sin precio" : dinero(t.precio)) : "$ —"; }

  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target.id;
    if (f === "f-login") login();
    else if (f === "f-buscar") { ui.cliQ = val("buscar"); ui.cliForm = false; mostrar(); }
    else if (f === "f-cliente") registrarCliente();
    else if (f === "f-venta") registrarVenta();
    else if (f === "f-filtro") { ui.venD1 = val("d1"); ui.venD2 = val("d2"); mostrar(); }
    else if (f === "f-prod") registrarProduccion();
    else if (f === "f-emp") registrarEmpleado();
    else if (f === "f-ins") registrarInsumos();
  });
  document.addEventListener("reset", function (ev) {
    setTimeout(function () {
      ev.target.querySelectorAll(".campo").forEach(function (c) { c.classList.remove("error"); var m = c.querySelector(".msg"); if (m) m.textContent = ""; });
      if (ev.target.id === "f-prod") $("fp").value = isoHoy();
      if (ev.target.id === "f-venta") { $("fv").value = fechaHoy(); $("pv").value = "$ —"; }
      if (ev.target.id === "f-emp") $("er").value = "Empleado";
      if (ev.target.id === "f-ins") { $("ifc").value = isoHoy(); ui.insPre = null; }
    }, 0);
  });

  /* ---------- Lógica de cada historia de usuario ---------- */
  function login() { // HU001
    var us = val("usuario"), cl = $("clave").value;
    var u = db.usuarios.filter(function (x) { return x.usuario.toLowerCase() === us.toLowerCase() && x.clave === cl && x.estado; })[0];
    if (!us || !cl || !u) { ui.loginErr = true; ui.loginUser = us; mostrar(); return; }
    ui.loginErr = false; ui.loginUser = ""; sesion = { id: u.id }; guardarSesion();
    var dest = ui.despues; ui.despues = null;
    ir(dest && (RUTAS[dest].rol !== "Administrador" || u.rol === "Administrador") ? dest : "menu");
  }
  function registrarCliente() { // HU003 escenario 2 · RF03
    var nom = val("nom"), ape = val("ape"), tel = val("tel"), doc = val("doc"), cor = val("cor"), malo = false;
    marcar("nom", nom ? "" : "Escriba el nombre."); marcar("ape", ape ? "" : "Escriba el apellido."); marcar("tel", tel ? "" : "Escriba el teléfono.");
    if (!nom || !ape || !tel) malo = true;
    if (doc && db.clientes.some(function (c) { return c.documento === doc; })) { marcar("doc", "Ya hay un cliente con ese documento."); malo = true; } else marcar("doc");
    if (cor && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cor)) { marcar("cor", "Revise el correo."); malo = true; } else marcar("cor");
    if (malo) return;
    db.seq.cliente++; var c = { id: db.seq.cliente, nombre: nom, apellido: ape, telefono: tel, documento: doc, direccion: val("dir"), correo: cor };
    db.clientes.push(c); guardar();
    ui.cliForm = false; ui.cliQ = ""; ui.cliOk = "<b>Cliente registrado:</b> " + esc(nombreCli(c)) + ". Ya puede tomarle un pedido.";
    mostrar();
  }
  function registrarPedido() { // HU004 · RF05
    guardarBorradorPedido();
    var cId = ui.pedCli, fecha = ui.pedFecha, malo = false;
    if (!cId) { marcar("pcli", "Seleccione el cliente del pedido."); malo = true; }
    marcar("fent", fecha ? "" : "Indique la fecha de entrega."); if (!fecha) malo = true;
    var pedidos = db.tipos.map(function (t) { return { t: t, q: parseInt((ui.pedCant || {})[t.id], 10) || 0 }; }).filter(function (x) { return x.q > 0; });
    if (malo) { ui.pedMsg = alerta("err", "<b>Faltan datos obligatorios.</b> Revise los campos marcados."); mostrar(); if (!cId) marcar("pcli", "Seleccione el cliente del pedido."); if (!fecha) marcar("fent", "Indique la fecha de entrega."); return; }
    if (!pedidos.length) { ui.pedMsg = alerta("err", "<b>Ingrese al menos un producto</b> con una cantidad mayor a cero."); mostrar(); return; }
    var sinPrecio = pedidos.filter(function (x) { return x.t.precio == null; });
    if (sinPrecio.length) { ui.pedMsg = alerta("err", "<b>Sin precio vigente:</b> " + sinPrecio.map(function (x) { return esc(x.t.nombre); }).join(", ") + '. Regístrelo en <a href="#precios">Precios</a> antes de tomar el pedido.'); mostrar(); return; }
    var ok = pedidos.filter(function (x) { return x.q <= x.t.disp; }), no = pedidos.filter(function (x) { return x.q > x.t.disp; });
    if (!ok.length) { ui.pedMsg = alerta("err", "<b>No se registró el pedido:</b> ninguno de los productos está disponible (" + no.map(function (x) { return esc(x.t.nombre) + ": " + x.t.disp + " disp."; }).join(", ") + ")."); mostrar(); return; }
    db.seq.pedido++;
    var items = ok.map(function (x) { return { tipoId: x.t.id, cant: x.q, precio: x.t.precio }; });
    var p = { id: db.seq.pedido, clienteId: cId, entrega: isoAFecha(fecha), estado: "Pendiente", items: items, total: items.reduce(function (s, i) { return s + i.cant * i.precio; }, 0), creado: fechaHoy() };
    db.pedidos.push(p); guardar();
    ui.pedCli = null; ui.pedCant = {}; ui.pedFecha = "";
    ui.pedListMsg = no.length ? alerta("warn", "<b>Pedido " + num(p.id, 4) + " registrado con disponibilidad parcial.</b> No se incluyó: " + no.map(function (x) { return esc(x.t.nombre) + " (disponibles: " + x.t.disp + ")"; }).join(", ") + ".")
      : alerta("ok", "<b>Pedido " + num(p.id, 4) + " registrado</b> con todos los productos. Estado: Pendiente.");
    ir("pedidos");
  }
  function abrirPago(id) { // HU009
    var p = db.pedidos.filter(function (x) { return x.id === id; })[0];
    hoja("<h3>Confirmar pago del pedido " + num(p.id, 4) + '</h3><p style="margin:0">Cliente: <b>' + esc(nombreCli(cliente(p.clienteId))) + "</b> · Total: <b>" + dinero(p.total) + "</b></p>" +
      campo("mp", "Método de pago", '<select id="mp"><option value="">Seleccione…</option><option>Efectivo</option><option>Transferencia</option></select>', { req: true }) +
      '<p class="ayuda">Al confirmar, el sistema registra la venta con la fecha actual y los productos del pedido, y descuenta las existencias.</p>' +
      '<div class="acciones"><button class="btn btn-pri" data-a="pago-si" data-id="' + p.id + '">' + icono("badge-check") + ' Confirmar pago</button><button class="btn btn-sec" data-a="pago-no" data-id="' + p.id + '">Cancelar</button></div>');
  }
  function confirmarPago(id) {
    var p = db.pedidos.filter(function (x) { return x.id === id; })[0], mp = val("mp");
    if (!mp) { marcar("mp", "Seleccione el método de pago."); return; }
    var falta = p.items.filter(function (i) { return i.cant > tipo(i.tipoId).disp; });
    if (falta.length) { marcar("mp", "No hay existencias suficientes de " + falta.map(function (i) { return tipo(i.tipoId).nombre + " (disponibles: " + tipo(i.tipoId).disp + ")"; }).join(", ") + ". Registre producción primero."); return; }
    p.items.forEach(function (i) { var t = tipo(i.tipoId); t.disp -= i.cant; t.act = ahora(); });
    p.estado = "Pagado";
    db.seq.venta++;
    db.ventas.push({ id: db.seq.venta, fecha: fechaHoy(), origen: "Pedido " + num(p.id, 4), pedidoId: p.id, metodo: mp, items: p.items.map(function (i) { return { tipoId: i.tipoId, cant: i.cant, precio: i.precio }; }), total: p.total });
    guardar(); cerrarHoja();
    ui.pedListMsg = alerta("ok", "<b>Pago confirmado.</b> Se registró la venta " + num(db.seq.venta, 4) + " por " + dinero(p.total) + " y se descontaron las existencias.");
    mostrar();
  }
  function registrarVenta() { // HU006 · RF07
    var tId = parseInt(val("tt"), 10), cTxt = val("cv"), q = Number(cTxt), mp = val("mpv"), malo = false, t = tipo(tId);
    marcar("tt", tId ? "" : "Seleccione el tipo de tamal."); marcar("mpv", mp ? "" : "Seleccione el método de pago.");
    if (!cTxt) marcar("cv", "Ingrese la cantidad."); else if (!Number.isInteger(q) || q <= 0) marcar("cv", "La cantidad debe ser mayor a cero."); else marcar("cv");
    if (!tId || !mp || !cTxt) { ui.venMsg = null; mostrarErrorForm("Hay campos obligatorios vacíos."); return; }
    if (!Number.isInteger(q) || q <= 0) { mostrarErrorForm("La cantidad debe ser mayor a cero."); return; }
    if (!t) { mostrarErrorForm("El producto no fue encontrado."); return; }
    if (t.precio == null) { marcar("tt", "Este tamal no tiene precio vigente. Regístrelo en Precios."); mostrarErrorForm("El tamal no tiene precio vigente."); return; }
    if (q > t.disp) { marcar("cv", "Solo hay " + t.disp + " disponibles."); mostrarErrorForm("No hay existencias suficientes de " + esc(t.nombre) + "."); return; }
    t.disp -= q; t.act = ahora(); db.seq.venta++;
    db.ventas.push({ id: db.seq.venta, fecha: fechaHoy(), origen: "Venta directa", pedidoId: null, metodo: mp, items: [{ tipoId: t.id, cant: q, precio: t.precio }], total: q * t.precio });
    guardar();
    ui.venMsg = alerta("ok", "<b>Venta " + num(db.seq.venta, 4) + " registrada:</b> " + q + " " + esc(t.nombre) + " × " + dinero(t.precio) + " = " + dinero(q * t.precio) + ". Existencias de " + esc(t.nombre) + ": " + (t.disp + q) + " → " + t.disp + ".");
    mostrar();
  }
  function mostrarErrorForm(txt) {
    var f = document.querySelector("form.tarjeta"), prev = $("err-form"); if (prev) prev.remove();
    var d = document.createElement("div"); d.id = "err-form"; d.innerHTML = alerta("err", "<b>Error:</b> " + txt);
    f.parentNode.insertBefore(d.firstChild, f).id = "err-form"; if (window.lucide) lucide.createIcons();
    $("err-form").scrollIntoView({ block: "nearest" });
  }
  function registrarProduccion() { // HU008 · RF11
    var tId = parseInt(val("tp"), 10), cTxt = val("cp"), q = Number(cTxt), fecha = val("fp");
    marcar("tp", tId ? "" : "Seleccione el tipo de tamal."); marcar("fp", fecha ? "" : "Ingrese la fecha de producción.");
    if (!cTxt) marcar("cp", "Ingrese la cantidad producida."); else if (!Number.isInteger(q) || q <= 0) marcar("cp", "La cantidad debe ser mayor a cero."); else marcar("cp");
    if (!tId || !cTxt || !fecha) { mostrarErrorForm("Hay campos obligatorios vacíos."); return; }
    if (!Number.isInteger(q) || q <= 0) { mostrarErrorForm("La cantidad debe ser mayor a cero."); return; }
    var t = tipo(tId), antes = t.disp; t.disp += q; t.act = ahora();
    db.produccion.unshift({ tipoId: tId, cant: q, fecha: isoAFecha(fecha), obs: val("ob") }); guardar();
    ui.proNuevo = true; ui.proMsg = alerta("ok", "<b>Producción registrada.</b> Existencias de " + esc(t.nombre) + " actualizadas: " + antes + " → " + t.disp + ".");
    mostrar();
  }
  function registrarEmpleado() { // HU005 · RF12
    var en = val("en"), ea = val("ea"), ec = val("ec"), ef = val("ef"), eu = val("eu"), ep = $("ep").value, ep2 = $("ep2").value, malo = false;
    [["en", en, "Escriba los nombres."], ["ea", ea, "Escriba los apellidos."], ["ec", ec, "Escriba el cargo."], ["ef", ef, "Indique la fecha de ingreso."], ["eu", eu, "Escriba el nombre de usuario."], ["ep", ep, "Escriba la contraseña."], ["ep2", ep2, "Confirme la contraseña."]].forEach(function (x) { marcar(x[0], x[1] ? "" : x[2]); if (!x[1]) malo = true; });
    if (malo) { mostrarErrorForm("Hay campos obligatorios vacíos. Complete los campos marcados."); return; }
    var mismo = db.usuarios.filter(function (u) { return (u.nombres + " " + u.apellidos).toLowerCase() === (en + " " + ea).toLowerCase(); })[0];
    if (mismo && mismo.estado) { mostrarErrorForm("El empleado ya existe."); return; }
    if (mismo && !mismo.estado) { mostrarErrorForm("El empleado está inactivo. Puede activarlo en la lista de empleados registrados."); return; }
    if (db.usuarios.some(function (u) { return u.usuario.toLowerCase() === eu.toLowerCase(); })) { marcar("eu", "Ese nombre de usuario ya está en uso."); mostrarErrorForm("El nombre de usuario no se puede repetir."); return; }
    if (ep.length < 8) { marcar("ep", "Mínimo 8 caracteres."); mostrarErrorForm("La contraseña debe tener mínimo 8 caracteres."); return; }
    if (ep !== ep2) { marcar("ep2", "Las contraseñas no coinciden."); mostrarErrorForm("Las contraseñas no coinciden."); return; }
    db.seq.usuario++;
    db.usuarios.push({ id: db.seq.usuario, nombres: en, apellidos: ea, telefono: val("et"), cargo: ec, ingreso: ef, rol: "Empleado", usuario: eu, clave: ep, estado: true });
    guardar(); ui.empMsg = alerta("ok", "<b>Empleado registrado:</b> " + esc(en + " " + ea) + ". Ya puede iniciar sesión con el usuario <b>" + esc(eu) + "</b>.");
    mostrar();
  }
  function registrarPrecio(id) { // HU007 · RF13
    var t = tipo(id), txt = val("np" + id), v = Number(txt);
    if (!txt || !(v > 0)) { marcar("np" + id, "El precio debe ser mayor a cero."); ui.preMsg = null; var prev = $("err-form"); if (prev) prev.remove(); var d = document.createElement("div"); d.innerHTML = alerta("err", "<b>Error:</b> el precio debe ser mayor a cero (tipo " + esc(t.nombre) + ")."); var lst = document.querySelector(".lista"); lst.parentNode.insertBefore(d.firstChild, lst).id = "err-form"; if (window.lucide) lucide.createIcons(); return; }
    var antes = t.precio; t.precio = Math.round(v); guardar();
    ui.preMsg = alerta("ok", antes == null ? "<b>Precio registrado:</b> " + esc(t.nombre) + " " + dinero(t.precio) + "." : "<b>Precio actualizado:</b> " + esc(t.nombre) + " " + dinero(antes) + " → " + dinero(t.precio) + ".");
    mostrar();
  }

  window.addEventListener("hashchange", function () { cerrarHoja(); mostrar(); });
  if (!location.hash) { try { history.replaceState(null, "", "#" + (sesion ? "menu" : "login")); } catch (e) {} }
  mostrar();
})();
</script>

</body>
